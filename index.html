
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<meta name="theme-color" content="#f5f7ff">
<meta name="color-scheme" content="light">

<title>Josh Swift Dev | iPhone Apps</title>

<meta
    name="description"
    content="Discover iPhone apps created by Josh Swift Dev."
>

<style>

/* =========================================
   GLOBAL
========================================= */

:root {
    color-scheme: light;

    --text: #19233b;
    --muted: #64718b;
    --blue: #4865ec;
    --border: #e8ebf5;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            ellipse at 5% 10%,
            #dfeaff 0%,
            transparent 35%
        ),
        radial-gradient(
            ellipse at 95% 20%,
            #fce5f5 0%,
            transparent 32%
        ),
        radial-gradient(
            ellipse at 50% 85%,
            #e7f5ff 0%,
            transparent 40%
        ),
        #f8faff;

    background-attachment: fixed;

    -webkit-font-smoothing: antialiased;
}

a {
    text-decoration: none;
    color: inherit;
}

button,
input,
select {
    font: inherit;
}

button,
a,
select {
    -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible {
    outline: 3px solid #7c91ff;
    outline-offset: 3px;
}


/* =========================================
   NAVIGATION
========================================= */

header {
    position: sticky;
    top: 0;
    z-index: 100;

    background: rgba(255,255,255,.85);

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    border-bottom:
        1px solid rgba(255,255,255,.9);
}

nav {
    max-width: 1250px;
    min-height: 76px;

    padding: 12px 28px;
    margin: auto;

    display: flex;

    justify-content: space-between;
    align-items: center;

    gap: 20px;
}

.brand {
    display: flex;
    align-items: center;

    gap: 12px;

    font-size: 17px;
    font-weight: 800;
    letter-spacing: -.5px;
}

.brand-icon {
    display: grid;
    place-items: center;

    width: 42px;
    height: 42px;

    border-radius: 14px;

    color: white;
    font-size: 21px;

    background:
        linear-gradient(
            135deg,
            #4c8aff,
            #8655e9,
            #ed74b5
        );

    box-shadow:
        0 6px 16px #685de52b;
}

.nav-links {
    display: flex;
    align-items: center;

    gap: 26px;

    font-size: 13px;
    font-weight: 650;
}

.nav-links a:hover {
    color: var(--blue);
}

.contact-button {
    padding: 11px 19px;

    border-radius: 100px;

    color: white;

    background: #26365c;

    transition: .2s;
}

.contact-button:hover {
    background: var(--blue);

    color: white !important;

    transform: translateY(-2px);
}


/* =========================================
   MAIN CONTENT
========================================= */

main {
    max-width: 1250px;

    margin: auto;

    padding: 42px 30px 80px;
}

.section-heading {
    display: flex;

    justify-content: space-between;
    align-items: flex-end;

    gap: 15px;

    margin-bottom: 25px;
}

.section-heading h1 {
    margin: 0 0 7px;

    font-size: 32px;

    letter-spacing: -.9px;
}

.app-count {
    font-size: 13px;

    color: var(--muted);
}


/* =========================================
   TOOLBAR
========================================= */

.toolbar {
    display: flex;

    align-items: center;
    justify-content: space-between;

    flex-wrap: wrap;

    gap: 16px;

    margin-bottom: 25px;
}

.filters {
    display: flex;

    gap: 8px;

    overflow-x: auto;

    max-width: 100%;

    padding: 5px 2px;

    scrollbar-width: none;
}

.filters::-webkit-scrollbar {
    display: none;
}

.filter {
    flex-shrink: 0;

    padding: 10px 16px;

    border: 1px solid #e8eaf3;

    border-radius: 100px;

    background: white;

    color: #69758c;

    font-size: 11px;
    font-weight: 750;

    cursor: pointer;

    transition: .2s;
}

.filter:hover {
    border-color: #abbcff;

    color: var(--blue);
}

.filter.active {
    background: #4865ec;

    color: white;

    border-color: #4865ec;

    box-shadow:
        0 5px 13px #4865ec30;
}

.toolbar-right {
    display: flex;

    gap: 10px;
}

.search,
.sort-select {
    height: 43px;

    padding: 0 15px;

    border: 1px solid var(--border);

    border-radius: 13px;

    background: white;

    color: var(--text);

    font-size: 12px;

    outline: none;

    box-shadow:
        0 3px 12px #26365c07;
}

.search {
    width: 220px;
}

.sort-select {
    max-width: 190px;

    cursor: pointer;
}

.search:focus,
.sort-select:focus {
    border-color: #8398ff;

    box-shadow:
        0 0 0 4px #8398ff18;
}


/* =========================================
   APP GRID
========================================= */

.app-grid {
    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 19px;
}


/* =========================================
   APP CARDS
========================================= */

.app-card {
    display: flex;
    flex-direction: column;

    min-width: 0;

    overflow: hidden;

    background: white;

    border: 1px solid white;

    border-radius: 24px;

    box-shadow:
        0 6px 25px #34436e0d;

    transition:
        transform .25s,
        box-shadow .25s;
}

.app-card:hover {
    transform: translateY(-7px);

    box-shadow:
        0 20px 45px #34436e22;
}

.card-artwork {
    position: relative;

    height: 150px;

    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            #e5edff,
            #f8e8f7
        );
}

.artwork-blur {
    position: absolute;

    inset: -55px;

    background-position: center;
    background-size: cover;

    filter:
        blur(36px)
        saturate(1.45);

    opacity: .65;

    transform: scale(1.3);
}

.card-artwork::after {
    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            transparent,
            #ffffff3b
        );
}

.app-icon {
    position: absolute;

    z-index: 2;

    left: 22px;
    bottom: 17px;

    width: 83px;
    height: 83px;

    border-radius: 19px;

    object-fit: cover;

    background: white;

    border: 3px solid white;

    box-shadow:
        0 7px 22px #15234b33;
}

.card-content {
    display: flex;
    flex: 1;

    flex-direction: column;

    padding: 20px 22px 22px;
}

.category {
    align-self: flex-start;

    padding: 6px 10px;

    border-radius: 7px;

    background: #edf1ff;

    color: #5664b9;

    font-size: 10px;
    font-weight: 750;
}

.app-name {
    margin: 14px 0 9px;

    font-size: 18px;
    font-weight: 800;

    letter-spacing: -.5px;

    line-height: 1.25;

    overflow-wrap: anywhere;
}

.description {
    margin: 0 0 18px;

    color: #778299;

    font-size: 12px;

    line-height: 1.65;

    display: -webkit-box;

    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;

    overflow: hidden;
}

.card-bottom {
    margin-top: auto;

    padding-top: 15px;

    border-top:
        1px solid #f0f2f7;
}

.price-row {
    display: flex;

    align-items: center;
    justify-content: space-between;

    flex-wrap: wrap;

    gap: 6px;

    margin-bottom: 14px;
}

.price {
    font-size: 16px;

    font-weight: 800;

    color: #263657;
}

.iap {
    display: inline-flex;

    align-items: center;

    padding: 5px 8px;

    border-radius: 8px;

    background: #f1eaff;

    color: #7548c5;

    font-size: 10px;

    font-weight: 750;
}

.iap-unknown {
    background: #f2f4f8;

    color: #7a84a0;
}

.release-date {
    margin-bottom: 13px;

    font-size: 10px;

    color: #939bb0;
}

.store-link {
    display: flex;

    justify-content: center;
    align-items: center;

    min-height: 42px;

    padding: 10px;

    border-radius: 12px;

    background: #edf1ff;

    color: #4764dd;

    font-size: 12px;
    font-weight: 800;

    transition: .2s;
}

.store-link:hover {
    background: #4865ec;

    color: white;
}


/* =========================================
   LOADING
========================================= */

.loading-card {
    height: 370px;

    border-radius: 24px;

    background:
        linear-gradient(
            110deg,
            #e9edf8 8%,
            #ffffff 18%,
            #e9edf8 33%
        );

    background-size: 200% 100%;

    animation:
        shimmer 1.4s linear infinite;
}

@keyframes shimmer {
    to {
        background-position-x: -200%;
    }
}

.status-message {
    grid-column: 1 / -1;

    padding: 75px 20px;

    text-align: center;

    color: var(--muted);
}

.status-message strong {
    display: block;

    margin-bottom: 10px;

    font-size: 18px;

    color: var(--text);
}


/* =========================================
   FOOTER
========================================= */

footer {
    background:
        rgba(255,255,255,.85);

    border-top:
        1px solid var(--border);
}

.footer-inner {
    max-width: 1250px;

    margin: auto;

    padding: 30px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 20px;

    color: #8390a5;

    font-size: 12px;
}

.footer-links {
    display: flex;

    gap: 22px;
}

.footer-links a:hover {
    color: var(--blue);
}


/* =========================================
   RESPONSIVE
========================================= */

@media (max-width: 1050px) {

    .app-grid {
        grid-template-columns:
            repeat(3, minmax(0, 1fr));
    }

}

@media (max-width: 780px) {

    main {
        padding: 32px 20px 60px;
    }

    .app-grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 13px;
    }

    .toolbar-right {
        width: 100%;
    }

    .search {
        flex: 1;

        width: 100%;

        min-width: 0;
    }

}

@media (max-width: 480px) {

    nav {
        padding: 12px 17px;
    }

    .brand {
        font-size: 14px;
    }

    .brand-icon {
        width: 36px;
        height: 36px;
    }

    .nav-links {
        gap: 13px;

        font-size: 11px;
    }

    .contact-button {
        padding: 9px 12px;
    }

    main {
        padding: 25px 14px 60px;
    }

    .section-heading h1 {
        font-size: 24px;
    }

    .toolbar-right {
        flex-wrap: wrap;
    }

    .search {
        width: 100%;

        flex-basis: 100%;
    }

    .sort-select {
        width: 100%;

        max-width: none;
    }

    .app-grid {
        gap: 10px;
    }

    .app-card {
        border-radius: 18px;
    }

    .card-artwork {
        height: 105px;
    }

    .app-icon {
        width: 62px;
        height: 62px;

        left: 13px;
        bottom: 12px;

        border-radius: 15px;
    }

    .card-content {
        padding: 14px;
    }

    .app-name {
        font-size: 14px;
    }

    .description {
        font-size: 10.5px;
    }

    .price {
        font-size: 13px;
    }

    .store-link {
        font-size: 10px;
    }

    .footer-inner {
        flex-direction: column;

        text-align: center;
    }

}

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration:
            .01ms !important;

        transition-duration:
            .01ms !important;
    }

}

</style>
</head>

<script>

"use strict";


/* =========================================
   APP STORE CONFIGURATION
========================================= */


const DEVELOPER_ID = "6809669072";


const APPLE_LOOKUP =
    "https://itunes.apple.com/lookup?id=" +
    DEVELOPER_ID +
    "&entity=software&country=us&limit=200";


/*
    OPTIONAL VERIFIED CATALOG

    Create a file named:

    app-pricing.json

    Place it in the same directory
    as index.html.

    Example:

    {
      "apps": {
        "1234567890": {
          "price": 0,
          "currency": "USD",
          "hasIAP": true,
          "iapPrice": "$0.99"
        }
      }
    }

    Use your actual Apple track IDs.

    This website never contains
    App Store Connect credentials.
*/


const VERIFIED_CATALOG_URL =
    "./app-pricing.json";



/* =========================================
   STATE
========================================= */


let apps = [];

let verifiedCatalog = {};

let activeFilter = "all";



/* =========================================
   ELEMENTS
========================================= */


const appGrid =
    document.getElementById("appGrid");


const appCount =
    document.getElementById("appCount");


const search =
    document.getElementById("search");


const filters =
    document.getElementById("filters");


const sortSelect =
    document.getElementById("sortSelect");



/* =========================================
   VERIFIED CATALOG
========================================= */


async function loadVerifiedCatalog() {

    try {

        const response = await fetch(
            VERIFIED_CATALOG_URL,
            {
                cache: "no-store"
            }
        );


        if (!response.ok) {

            throw new Error(
                "Pricing catalog unavailable"
            );

        }


        const data =
            await response.json();


        if (
            data &&
            typeof data.apps === "object" &&
            data.apps !== null &&
            !Array.isArray(data.apps)
        ) {

            verifiedCatalog = data.apps;

        } else {

            verifiedCatalog = {};

        }


    } catch (error) {

        console.info(
            "Verified catalog unavailable. " +
            "Using public App Store information."
        );

        verifiedCatalog = {};

    }

}



/* =========================================
   LOAD APPS
========================================= */


async function loadApps() {

    try {


        /*
            Load pricing and app data
            independently.

            A missing pricing file should
            never prevent the website
            from loading its app cards.
        */


        const results = await Promise.all([

            fetch(
                APPLE_LOOKUP,
                {
                    cache: "no-store"
                }
            ),

            loadVerifiedCatalog()

        ]);


        const response = results[0];


        if (!response.ok) {

            throw new Error(
                "Apple lookup failed"
            );

        }


        const data =
            await response.json();


        apps = (
            data.results || []
        ).filter(

            item =>
                item.wrapperType === "software"

        );


        createFilters();

        renderApps();


    } catch (error) {


        console.error(
            "Unable to load apps:",
            error
        );


        appCount.textContent =
            "Apps";


        appGrid.innerHTML = `

            <div class="status-message">

                <strong>
                    Unable to load apps right now.
                </strong>

                Please try again in a moment.

            </div>

        `;


    }

}



/* =========================================
   VERIFIED ENTRY
========================================= */


function verifiedEntry(app) {


    /*
        Look up the verified record
        using either:

        1. App Store track ID
        2. Bundle identifier
    */


    const trackId =
        String(app.trackId || "");


    const bundleId =
        app.bundleId || "";


    return (

        verifiedCatalog[trackId] ||

        verifiedCatalog[bundleId] ||

        null

    );

}



/* =========================================
   PRICE HELPERS
========================================= */


function getNumericPrice(app) {


    const entry =
        verifiedEntry(app);



    /*
        Verified App Store Connect
        pricing takes priority.
    */


    if (

        entry &&

        typeof entry.price === "number" &&

        Number.isFinite(entry.price)

    ) {

        return entry.price;

    }



    /*
        Fall back to Apple's
        public listing price.
    */


    if (

        typeof app.price === "number" &&

        Number.isFinite(app.price)

    ) {

        return app.price;

    }



    /*
        Missing pricing does not
        mean the app is free.
    */


    return null;

}



/* =========================================
   CURRENCY FORMAT
========================================= */


function formatCurrency(
    amount,
    currency = "USD"
) {


    try {

        return new Intl.NumberFormat(

            "en-US",

            {
                style: "currency",

                currency: currency
            }

        ).format(amount);


    } catch (error) {


        return (
            "$" +
            amount.toFixed(2)
        );


    }

}



/* =========================================
   PRICE AND IAP INFORMATION
========================================= */


function getPriceInfo(app) {


    const entry =
        verifiedEntry(app);


    const numeric =
        getNumericPrice(app);


    let mainPrice =
        "Price unavailable";



    /*
        1. Verified formatted price
    */


    if (

        entry &&

        typeof entry.displayPrice === "string" &&

        entry.displayPrice.trim()

    ) {


        mainPrice =
            entry.displayPrice.trim();


    }


    /*
        2. Verified numeric price
    */


    else if (

        entry &&

        typeof entry.price === "number" &&

        Number.isFinite(entry.price)

    ) {


        mainPrice =
            entry.price === 0

                ? "Free"

                : formatCurrency(

                    entry.price,

                    entry.currency || "USD"

                );


    }


    /*
        3. Apple's public price
    */


    else if (

        typeof app.formattedPrice === "string" &&

        app.formattedPrice.trim()

    ) {


        mainPrice =
            app.formattedPrice.trim();


    }


    /*
        4. Apple's numeric price
    */


    else if (
        numeric !== null
    ) {


        mainPrice =
            numeric === 0

                ? "Free"

                : formatCurrency(

                    numeric,

                    app.currency || "USD"

                );


    }



    /*
        Public Apple lookup data
        cannot reliably confirm
        whether an app has IAPs.

        Only show confirmed
        IAP information from
        our verified catalog.
    */


    let hasIAP = null;


    let iapPrice = null;



    if (

        entry &&

        typeof entry.hasIAP === "boolean"

    ) {


        hasIAP =
            entry.hasIAP;


    }



    if (

        entry &&

        typeof entry.iapPrice === "string"

    ) {


        iapPrice =
            entry.iapPrice.trim() || null;


    }



    return {

        mainPrice,

        numeric,

        hasIAP,

        iapPrice

    };

}



/* =========================================
   CATEGORY FILTERS
========================================= */


function createFilters() {


    const genres = [

        ...new Set(

            apps

                .map(
                    app =>
                        app.primaryGenreName
                )

                .filter(Boolean)

        )

    ].sort();



    filters.replaceChildren();



    const categories = [

        {

            label: "All Apps",

            value: "all"

        },

        ...genres.map(

            genre => ({

                label: genre,

                value: genre

            })

        )

    ];



    categories.forEach(category => {


        const button =
            document.createElement(
                "button"
            );


        button.type =
            "button";


        button.className =

            "filter" +

            (
                category.value === activeFilter

                    ? " active"

                    : ""
            );


        button.dataset.filter =
            category.value;


        button.textContent =
            category.label;



        button.addEventListener(
            "click",
            () => {


                activeFilter =
                    category.value;



                filters

                    .querySelectorAll(
                        ".filter"
                    )

                    .forEach(item => {


                        item.classList.toggle(

                            "active",

                            item === button

                        );


                    });



                renderApps();


            }
        );



        filters.appendChild(
            button
        );


    });

}



/* =========================================
   APP ARTWORK
========================================= */


function getArtwork(app) {


    const artwork =

        app.artworkUrl512 ||

        app.artworkUrl100 ||

        app.artworkUrl60 ||

        "";



    return artwork.replace(

        /[0-9]+x[0-9]+bb/,

        "512x512bb"

    );

}



/* =========================================
   RELEASE DATE
========================================= */


function getReleaseTimestamp(app) {


    const time =
        new Date(

            app.releaseDate || 0

        ).getTime();



    return Number.isFinite(time)

        ? time

        : 0;

}



function formatReleaseDate(app) {


    if (!app.releaseDate) {

        return "";

    }



    const date =
        new Date(
            app.releaseDate
        );



    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";

    }



    return date.toLocaleDateString(

        "en-US",

        {

            month: "short",

            day: "numeric",

            year: "numeric"

        }

    );

}



/* =========================================
   DESCRIPTION
========================================= */


function cleanDescription(description) {


    if (!description) {

        return (
            "Discover this app " +
            "on the App Store."
        );

    }



    return description

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}



/* =========================================
   SORTING
========================================= */


function sortApps(list) {


    const sorted =
        [...list];



    const byName = (a, b) =>

        (
            a.trackName || ""
        ).localeCompare(

            b.trackName || ""

        );



    switch (
        sortSelect.value
    ) {



        case "release-newest":


            sorted.sort(

                (a, b) =>

                    getReleaseTimestamp(b) -

                    getReleaseTimestamp(a) ||

                    byName(a, b)

            );


            break;



        case "release-oldest":


            sorted.sort(

                (a, b) =>

                    getReleaseTimestamp(a) -

                    getReleaseTimestamp(b) ||

                    byName(a, b)

            );


            break;



        case "price-low":


            sorted.sort(
                (a, b) => {


                    const priceA =
                        getNumericPrice(a);


                    const priceB =
                        getNumericPrice(b);



                    /*
                        Unknown prices sort last.
                    */


                    if (priceA === null) {
                        return priceB === null
                            ? byName(a, b)
                            : 1;
                    }


                    if (priceB === null) {
                        return -1;
                    }



                    return (

                        priceA - priceB ||

                        byName(a, b)

                    );


                }
            );


            break;



        case "price-high":


            sorted.sort(
                (a, b) => {


                    const priceA =
                        getNumericPrice(a);


                    const priceB =
                        getNumericPrice(b);



                    if (priceA === null) {
                        return priceB === null
                            ? byName(a, b)
                            : 1;
                    }


                    if (priceB === null) {
                        return -1;
                    }



                    return (

                        priceB - priceA ||

                        byName(a, b)

                    );


                }
            );


            break;



        default:


            sorted.sort(
                byName
            );


    }



    return sorted;

}



/* =========================================
   CREATE APP CARD
========================================= */


function createCard(app) {


    const artwork =
        getArtwork(app);


    const priceInfo =
        getPriceInfo(app);


    const released =
        formatReleaseDate(app);



    const card =
        document.createElement(
            "article"
        );


    card.className =
        "app-card";



    /* ARTWORK */


    const artworkArea =
        document.createElement(
            "div"
        );


    artworkArea.className =
        "card-artwork";



    const blur =
        document.createElement(
            "div"
        );


    blur.className =
        "artwork-blur";



    if (artwork) {


        blur.style.backgroundImage =
            `url("${artwork}")`;


    }



    const icon =
        document.createElement(
            "img"
        );


    icon.className =
        "app-icon";


    icon.src =
        artwork;


    icon.alt =

        (
            app.trackName || "App"
        ) +

        " icon";


    icon.loading =
        "lazy";



    artworkArea.appendChild(
        blur
    );


    artworkArea.appendChild(
        icon
    );



    /* CONTENT */


    const content =
        document.createElement(
            "div"
        );


    content.className =
        "card-content";



    const category =
        document.createElement(
            "span"
        );


    category.className =
        "category";


    category.textContent =

        app.primaryGenreName ||

        "iPhone App";



    const name =
        document.createElement(
            "h3"
        );


    name.className =
        "app-name";


    name.textContent =

        app.trackName ||

        "iPhone App";



    const description =
        document.createElement(
            "p"
        );


    description.className =
        "description";


    description.textContent =
        cleanDescription(
            app.description
        );



    /* BOTTOM SECTION */


    const bottom =
        document.createElement(
            "div"
        );


    bottom.className =
        "card-bottom";



    const priceRow =
        document.createElement(
            "div"
        );


    priceRow.className =
        "price-row";



    const price =
        document.createElement(
            "span"
        );


    price.className =
        "price";


    price.textContent =
        priceInfo.mainPrice;



    priceRow.appendChild(
        price
    );



    /* CONFIRMED IN-APP PURCHASE */


    if (
        priceInfo.hasIAP === true
    ) {


        const iap =
            document.createElement(
                "span"
            );


        iap.className =
            "iap";


        iap.textContent =

            priceInfo.iapPrice

                ? (
                    "In-App Purchase: " +
                    priceInfo.iapPrice
                )

                : "In-App Purchases";



        priceRow.appendChild(
            iap
        );


    }



    /* UNKNOWN IAP STATUS */


    if (
        priceInfo.hasIAP === null
    ) {


        const unknown =
            document.createElement(
                "span"
            );


        unknown.className =
            "iap iap-unknown";


        unknown.textContent =
            "IAP not verified";



        priceRow.appendChild(
            unknown
        );


    }



    bottom.appendChild(
        priceRow
    );



    /* RELEASE DATE */


    if (released) {


        const date =
            document.createElement(
                "div"
            );


        date.className =
            "release-date";


        date.textContent =
            "Released " + released;



        bottom.appendChild(
            date
        );


    }



    /* APP STORE LINK */


    const link =
        document.createElement(
            "a"
        );


    link.className =
        "store-link";


    link.href =

        app.trackViewUrl ||

        (
            "https://apps.apple.com/us/app/id" +

            app.trackId
        );



    link.target =
        "_blank";


    link.rel =
        "noopener noreferrer";


    link.textContent =
        "View on App Store →";



    bottom.appendChild(
        link
    );



    /* ASSEMBLE */


    content.appendChild(
        category
    );


    content.appendChild(
        name
    );


    content.appendChild(
        description
    );


    content.appendChild(
        bottom
    );



    card.appendChild(
        artworkArea
    );


    card.appendChild(
        content
    );



    return card;

}



/* =========================================
   RENDER APPS
========================================= */


function renderApps() {


    const query =

        search.value

            .trim()

            .toLowerCase();



    let visibleApps =
        apps.filter(app => {



            const categoryMatch =

                activeFilter === "all" ||

                app.primaryGenreName ===
                    activeFilter;



            const searchableText = [

                app.trackName || "",

                app.primaryGenreName || "",

                app.description || ""

            ]

                .join(" ")

                .toLowerCase();



            return (

                categoryMatch &&

                (

                    !query ||

                    searchableText.includes(
                        query
                    )

                )

            );


        });



    visibleApps =
        sortApps(
            visibleApps
        );



    appGrid.replaceChildren();



    visibleApps.forEach(app => {


        appGrid.appendChild(

            createCard(app)

        );


    });



    appCount.textContent =

        apps.length === 1

            ? "1 app available"

            : (
                apps.length +
                " apps available"
            );



    if (
        visibleApps.length === 0
    ) {


        const message =
            document.createElement(
                "div"
            );


        message.className =
            "status-message";



        const heading =
            document.createElement(
                "strong"
            );


        heading.textContent =
            "No apps found.";



        message.appendChild(
            heading
        );



        message.append(

            "Try another search or category."

        );



        appGrid.appendChild(
            message
        );


    }

}



/* =========================================
   EVENTS
========================================= */


search.addEventListener(

    "input",

    renderApps

);



sortSelect.addEventListener(

    "change",

    renderApps

);



/* =========================================
   START
========================================= */


loadApps();


</script>
