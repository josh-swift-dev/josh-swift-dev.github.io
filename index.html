<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Josh Swift Dev</title>
<meta name="description" content="iPhone apps by Josh Swift Dev.">

<style>

:root {
    --bg: #f5f5f7;
    --surface: rgba(255,255,255,.82);
    --text: #1d1d1f;
    --secondary: #6e6e73;
    --tertiary: #86868b;
    --border: rgba(0,0,0,.065);
    --border-hover: rgba(0,0,0,.12);
    --blue: #0071e3;
    --pill: rgba(0,0,0,.055);
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;

    background:
        radial-gradient(
            circle at 8% 0%,
            rgba(0,122,255,.045),
            transparent 26%
        ),
        radial-gradient(
            circle at 94% 4%,
            rgba(175,82,222,.03),
            transparent 24%
        ),
        var(--bg);

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

    -webkit-font-smoothing: antialiased;
}

a {
    color: inherit;
    text-decoration: none;
}


/* =========================================================
   HEADER
========================================================= */

header {
    position: sticky;
    top: 0;
    z-index: 1000;

    background:
        rgba(245,245,247,.76);

    backdrop-filter:
        blur(26px)
        saturate(180%);

    -webkit-backdrop-filter:
        blur(26px)
        saturate(180%);

    border-bottom:
        1px solid
        rgba(0,0,0,.05);
}

nav {
    max-width: 1180px;
    height: 56px;

    margin: auto;
    padding: 0 30px;

    display: flex;
    align-items: center;
    justify-content: flex-end;
}

.nav-links {
    display: flex;
    align-items: center;

    gap: 28px;

    color: var(--secondary);

    font-size: 12.5px;
    font-weight: 500;
}

.nav-links a {
    transition: color .2s ease;
}

.nav-links a:hover {
    color: var(--text);
}


/* =========================================================
   MAIN
========================================================= */

main {
    max-width: 1180px;

    margin: auto;

    padding:
        40px
        30px
        78px;
}


/* =========================================================
   APP COUNT
========================================================= */

.top-area {
    margin-bottom: 17px;
}

.app-count {
    color: var(--secondary);

    font-size: 11.5px;
    font-weight: 550;
}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 18px;

    margin-bottom: 24px;
}

.filters {
    display: flex;
    align-items: center;

    gap: 7px;

    overflow-x: auto;

    padding: 2px 0;

    scrollbar-width: none;
}

.filters::-webkit-scrollbar {
    display: none;
}

.filter {
    border: none;

    cursor: pointer;

    padding:
        7px
        12px;

    border-radius: 999px;

    background: var(--pill);
    color: var(--secondary);

    font-family: inherit;

    font-size: 10.5px;
    font-weight: 600;

    white-space: nowrap;

    transition:
        background .2s ease,
        color .2s ease,
        transform .2s ease;
}

.filter:hover {
    color: var(--text);

    transform:
        translateY(-1px);
}

.filter.active {
    background: var(--text);
    color: white;
}


/* =========================================================
   SEARCH
========================================================= */

.search-wrap {
    position: relative;

    min-width: 220px;
}

.search {
    width: 100%;
    height: 36px;

    padding:
        0
        14px
        0
        36px;

    border:
        1px solid
        var(--border);

    border-radius: 12px;

    background:
        rgba(255,255,255,.70);

    color: var(--text);

    font-family: inherit;
    font-size: 11.5px;

    outline: none;

    transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
}

.search:focus {
    background:
        rgba(255,255,255,.96);

    border-color:
        rgba(0,113,227,.33);

    box-shadow:
        0 0 0 4px
        rgba(0,113,227,.07);
}

.search-icon {
    position: absolute;

    top: 50%;
    left: 13px;

    transform:
        translateY(-50%);

    color: var(--tertiary);

    pointer-events: none;

    font-size: 13px;
}


/* =========================================================
   GRID
========================================================= */

.app-grid {
    display: grid;

    grid-template-columns:
        repeat(4, minmax(0,1fr));

    gap: 14px;
}


/* =========================================================
   SQUARE APP CARDS
========================================================= */

.app-card {
    position: relative;

    aspect-ratio: 1 / 1;

    padding: 20px;

    overflow: hidden;

    display: flex;
    flex-direction: column;

    background: var(--surface);

    backdrop-filter:
        blur(20px)
        saturate(140%);

    -webkit-backdrop-filter:
        blur(20px)
        saturate(140%);

    border:
        1px solid
        var(--border);

    border-radius: 24px;

    box-shadow:
        0 4px 14px
        rgba(0,0,0,.025);

    transition:
        transform .24s ease,
        box-shadow .24s ease,
        border-color .24s ease,
        background .24s ease;
}

.app-card:hover {
    transform:
        translateY(-4px);

    background:
        rgba(255,255,255,.97);

    border-color:
        var(--border-hover);

    box-shadow:
        0 18px 38px
        rgba(0,0,0,.075);
}


/* soft blue glow */

.app-card::before {
    content: "";

    position: absolute;

    width: 150px;
    height: 150px;

    top: -80px;
    right: -80px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0,113,227,.08),
            transparent 68%
        );

    opacity: 0;

    transition: opacity .25s ease;
}

.app-card:hover::before {
    opacity: 1;
}


/* =========================================================
   APP ICON
========================================================= */

.app-icon {
    position: relative;

    z-index: 2;

    width: 62px;
    height: 62px;

    min-width: 62px;

    border-radius: 15px;

    overflow: hidden;

    background: #e8e8ed;

    box-shadow:
        0 6px 16px
        rgba(0,0,0,.13);

    transition:
        transform .24s ease,
        box-shadow .24s ease;
}

.app-card:hover .app-icon {
    transform:
        scale(1.045);

    box-shadow:
        0 8px 20px
        rgba(0,0,0,.16);
}

.app-icon img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
}


/* =========================================================
   APP INFO
========================================================= */

.app-info {
    position: relative;

    z-index: 2;

    flex: 1;

    min-height: 0;

    display: flex;
    flex-direction: column;
}

.app-name {
    margin:
        16px
        0
        2px;

    font-size: 16px;
    font-weight: 690;

    letter-spacing:
        -.025em;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.category {
    margin-bottom: 9px;

    color: var(--tertiary);

    font-size: 9.5px;
    font-weight: 600;
}

.description {
    margin: 0;

    color: var(--secondary);

    font-size: 10.8px;
    line-height: 1.42;

    display: -webkit-box;

    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;

    overflow: hidden;
}

.actions {
    margin-top: auto;

    padding-top: 12px;
}


/* =========================================================
   APP STORE BUTTON
========================================================= */

.store-link {
    display: inline-flex;
    align-items: center;

    padding:
        7px
        11px;

    border-radius: 999px;

    background:
        rgba(0,113,227,.09);

    color: var(--blue);

    font-size: 10px;
    font-weight: 650;

    transition:
        background .2s ease,
        transform .2s ease;
}

.store-link:hover {
    background:
        rgba(0,113,227,.15);

    transform:
        translateY(-1px);
}


/* =========================================================
   LOADING
========================================================= */

.loading-card {
    aspect-ratio: 1 / 1;

    border-radius: 24px;

    background:
        linear-gradient(
            110deg,
            rgba(255,255,255,.35) 8%,
            rgba(255,255,255,.7) 18%,
            rgba(255,255,255,.35) 33%
        );

    background-size:
        200% 100%;

    animation:
        shimmer 1.4s linear infinite;

    border:
        1px solid
        var(--border);
}

@keyframes shimmer {

    to {
        background-position-x: -200%;
    }

}


/* =========================================================
   STATUS / ERROR
========================================================= */

.status-message {
    grid-column:
        1 / -1;

    padding:
        70px
        20px;

    text-align: center;

    color: var(--secondary);

    font-size: 13px;
    line-height: 1.6;
}

.status-message strong {
    display: block;

    margin-bottom: 5px;

    color: var(--text);

    font-size: 15px;
}


/* =========================================================
   FOOTER
========================================================= */

footer {
    max-width: 1180px;

    margin: auto;

    padding:
        25px
        30px
        35px;

    border-top:
        1px solid
        var(--border);

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 20px;

    color: var(--tertiary);

    font-size: 10.5px;
}

.footer-links {
    display: flex;

    gap: 20px;
}

.footer-links a:hover {
    color: var(--text);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1050px) {

    .app-grid {
        grid-template-columns:
            repeat(3, minmax(0,1fr));
    }

}

@media(max-width:760px) {

    nav {
        justify-content: center;
    }

    main {
        padding:
            32px
            20px
            65px;
    }

    .toolbar {
        display: block;
    }

    .search-wrap {
        width: 100%;
        min-width: 0;

        margin-top: 12px;
    }

    .app-grid {
        grid-template-columns:
            repeat(2, minmax(0,1fr));

        gap: 12px;
    }

    .app-card {
        padding: 17px;

        border-radius: 21px;
    }

    .app-icon {
        width: 56px;
        height: 56px;

        min-width: 56px;

        border-radius: 14px;
    }

    .description {
        -webkit-line-clamp: 2;
    }

}

@media(max-width:430px) {

    main {
        padding-left: 14px;
        padding-right: 14px;
    }

    .app-grid {
        gap: 9px;
    }

    .app-card {
        padding: 14px;

        border-radius: 18px;
    }

    .app-icon {
        width: 49px;
        height: 49px;

        min-width: 49px;

        border-radius: 12px;
    }

    .app-name {
        margin-top: 12px;

        font-size: 13.5px;
    }

    .category {
        margin-bottom: 6px;

        font-size: 8.5px;
    }

    .description {
        font-size: 9.3px;

        line-height: 1.35;

        -webkit-line-clamp: 2;
    }

    .actions {
        padding-top: 7px;
    }

    .store-link {
        padding:
            5px
            7px;

        font-size: 8.5px;
    }

}


/* =========================================================
   DARK MODE
========================================================= */

@media(prefers-color-scheme:dark) {

    :root {
        --bg: #000000;
        --surface: rgba(28,28,30,.80);
        --text: #f5f5f7;
        --secondary: #a1a1a6;
        --tertiary: #86868b;
        --border: rgba(255,255,255,.085);
        --border-hover: rgba(255,255,255,.16);
        --pill: rgba(255,255,255,.08);
    }

    body {
        background:
            radial-gradient(
                circle at 8% 0%,
                rgba(0,122,255,.10),
                transparent 26%
            ),
            radial-gradient(
                circle at 94% 4%,
                rgba(175,82,222,.055),
                transparent 22%
            ),
            #000;
    }

    header {
        background:
            rgba(0,0,0,.72);

        border-bottom-color:
            rgba(255,255,255,.07);
    }

    .filter.active {
        background: #f5f5f7;

        color: #111;
    }

    .search {
        background:
            rgba(28,28,30,.78);
    }

    .search:focus {
        background:
            rgba(35,35,37,.98);
    }

    .app-card:hover {
        background:
            rgba(32,32,34,.97);
    }

}

</style>
</head>


<body>


<header>

<nav>

<div class="nav-links">

<a href="#apps">
Apps
</a>

<a href="mailto:josh.swift.dev@gmail.com">
Contact
</a>

</div>

</nav>

</header>



<main>


<section id="apps">


<div class="top-area">

<div
    class="app-count"
    id="appCount"
>
Loading apps…
</div>

</div>



<div class="toolbar">


<div
    class="filters"
    id="filters"
>

<button
    class="filter active"
    data-filter="all"
>
All
</button>

</div>


<div class="search-wrap">

<span class="search-icon">
⌕
</span>

<input
    id="search"
    class="search"
    type="search"
    placeholder="Search apps"
    aria-label="Search apps"
>

</div>


</div>



<div
    class="app-grid"
    id="appGrid"
>

<div class="loading-card"></div>
<div class="loading-card"></div>
<div class="loading-card"></div>
<div class="loading-card"></div>

<div class="loading-card"></div>
<div class="loading-card"></div>
<div class="loading-card"></div>
<div class="loading-card"></div>

</div>


</section>


</main>



<footer>

<div>
© 2026 Josh Swift Dev
</div>


<div class="footer-links">

<a href="#apps">
Apps
</a>

<a href="mailto:josh.swift.dev@gmail.com">
Contact
</a>

</div>

</footer>



<script>

/* =========================================================
   JOSH SWIFT DEV
   APPLE DEVELOPER ID
========================================================= */

const DEVELOPER_ID =
    "6809669072";


const APPLE_LOOKUP =
    "https://itunes.apple.com/lookup?id=" +
    DEVELOPER_ID +
    "&entity=software&country=us&limit=200";


/* =========================================================
   STATE
========================================================= */

let apps = [];

let activeFilter = "all";


/* =========================================================
   ELEMENTS
========================================================= */

const appGrid =
    document.getElementById(
        "appGrid"
    );

const appCount =
    document.getElementById(
        "appCount"
    );

const search =
    document.getElementById(
        "search"
    );

const filters =
    document.getElementById(
        "filters"
    );


/* =========================================================
   LOAD APPS FROM APPLE
========================================================= */

async function loadApps() {

    try {

        const response =
            await fetch(
                APPLE_LOOKUP,
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Apple lookup failed"
            );

        }


        const data =
            await response.json();


        /*
           The developer lookup may include a developer
           record along with software records.

           We only keep actual software applications.
        */

        apps =
            data.results
                .filter(
                    item =>
                        item.wrapperType ===
                        "software"
                )
                .sort(
                    (a, b) =>
                        a.trackName.localeCompare(
                            b.trackName
                        )
                );


        createFilters();

        renderApps();

    }

    catch(error) {

        console.error(
            "Unable to load App Store apps:",
            error
        );


        appCount.textContent =
            "Apps";


        appGrid.innerHTML =
            `
            <div class="status-message">

                <strong>
                    Unable to load apps right now.
                </strong>

                Please try again in a moment.

            </div>
            `;

    }

}


/* =========================================================
   CREATE CATEGORY FILTERS
========================================================= */

function createFilters() {

    const genres =
        [
            ...new Set(
                apps
                    .map(
                        app =>
                            app.primaryGenreName
                    )
                    .filter(Boolean)
            )
        ]
        .sort();


    filters.innerHTML =
        `
        <button
            class="filter active"
            data-filter="all"
        >
            All
        </button>
        `;


    genres.forEach(
        genre => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "filter";


            button.dataset.filter =
                genre;


            button.textContent =
                genre;


            filters.appendChild(
                button
            );

        }
    );


    filters
        .querySelectorAll(
            ".filter"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        filters
                            .querySelectorAll(
                                ".filter"
                            )
                            .forEach(
                                item =>
                                    item.classList.remove(
                                        "active"
                                    )
                            );


                        button.classList.add(
                            "active"
                        );


                        activeFilter =
                            button.dataset.filter;


                        renderApps();

                    }
                );

            }
        );

}


/* =========================================================
   CREATE APP CARD
========================================================= */

function createCard(
    app
) {

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "app-card";


    /* ICON */

    const icon =
        document.createElement(
            "div"
        );


    icon.className =
        "app-icon";


    const image =
        document.createElement(
            "img"
        );


    /*
       Apple normally supplies artworkUrl512,
       artworkUrl100 and artworkUrl60.
    */

    image.src =
        app.artworkUrl512 ||
        app.artworkUrl100 ||
        app.artworkUrl60 ||
        "";


    image.alt =
        app.trackName +
        " app icon";


    image.loading =
        "lazy";


    image.referrerPolicy =
        "no-referrer";


    icon.appendChild(
        image
    );


    /* INFO */

    const info =
        document.createElement(
            "div"
        );


    info.className =
        "app-info";


    const name =
        document.createElement(
            "h3"
        );


    name.className =
        "app-name";


    name.textContent =
        app.trackName;


    const category =
        document.createElement(
            "div"
        );


    category.className =
        "category";


    category.textContent =
        app.primaryGenreName ||
        "iPhone App";


    const description =
        document.createElement(
            "p"
        );


    description.className =
        "description";


    description.textContent =
        cleanDescription(
            app.description
        );


    const actions =
        document.createElement(
            "div"
        );


    actions.className =
        "actions";


    const link =
        document.createElement(
            "a"
        );


    link.className =
        "store-link";


    link.href =
        app.trackViewUrl ||
        (
            "https://apps.apple.com/us/app/id" +
            app.trackId
        );


    link.target =
        "_blank";


    link.rel =
        "noopener";


    link.textContent =
        "View on App Store ›";


    actions.appendChild(
        link
    );


    info.appendChild(
        name
    );

    info.appendChild(
        category
    );

    info.appendChild(
        description
    );

    info.appendChild(
        actions
    );


    card.appendChild(
        icon
    );

    card.appendChild(
        info
    );


    return card;

}


/* =========================================================
   CLEAN DESCRIPTION
========================================================= */

function cleanDescription(
    description
) {

    if (!description) {

        return "Available on the App Store.";

    }


    /*
       Remove unnecessary whitespace so Apple's
       description looks clean inside the card.
    */

    return description
        .replace(
            /\s+/g,
            " "
        )
        .trim();

}


/* =========================================================
   RENDER APPS
========================================================= */

function renderApps() {

    const query =
        search.value
            .trim()
            .toLowerCase();


    const visibleApps =
        apps.filter(
            app => {

                const categoryMatch =
                    activeFilter === "all" ||
                    app.primaryGenreName ===
                    activeFilter;


                const searchableText =
                    (
                        app.trackName +
                        " " +
                        (
                            app.primaryGenreName ||
                            ""
                        ) +
                        " " +
                        (
                            app.description ||
                            ""
                        )
                    )
                    .toLowerCase();


                const searchMatch =
                    !query ||
                    searchableText.includes(
                        query
                    );


                return (
                    categoryMatch &&
                    searchMatch
                );

            }
        );


    appGrid.innerHTML =
        "";


    visibleApps.forEach(
        app => {

            appGrid.appendChild(
                createCard(
                    app
                )
            );

        }
    );


    /*
       Count always shows total public apps,
       not only the filtered number.
    */

    appCount.textContent =
        apps.length === 1
            ? "1 app available"
            : apps.length +
              " apps available";


    if (
        visibleApps.length === 0
    ) {

        appGrid.innerHTML =
            `
            <div class="status-message">

                <strong>
                    No apps found.
                </strong>

                Try another search or category.

            </div>
            `;

    }

}


/* =========================================================
   SEARCH
========================================================= */

search.addEventListener(
    "input",
    renderApps
);


/* =========================================================
   START
========================================================= */

loadApps();

</script>


</body>
</html>
