
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Josh Swift Dev | iPhone Apps</title>

<meta name="description"
content="Explore iPhone apps developed by Josh Swift Dev.">

<meta name="theme-color" content="#f6f8ff">

<style>
:root {
    --primary: #5267ed;
    --primary-dark: #394fce;
    --text: #1c2741;
    --muted: #78849a;
    --border: #e9edf7;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at 0% 5%, #e0eaff, transparent 35%),
        radial-gradient(circle at 100% 20%, #ffe5f3, transparent 30%),
        #f7f9ff;
    min-height: 100vh;
}

a {
    text-decoration: none;
    color: inherit;
}

header {
    background: rgba(255,255,255,.88);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid white;
    position: sticky;
    top: 0;
    z-index: 10;
}

nav {
    max-width: 1250px;
    margin: auto;
    padding: 16px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 800;
    font-size: 18px;
}

.logo-icon {
    background: linear-gradient(135deg,#478bff,#9259ed,#f174b7);
    color: white;
    width: 43px;
    height: 43px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    font-size: 23px;
}

.contact {
    background: #28375c;
    color: white;
    padding: 12px 20px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 700;
}

main {
    max-width: 1250px;
    margin: auto;
    padding: 50px 25px 80px;
}

h1 {
    font-size: clamp(27px,4vw,39px);
    margin: 0 0 9px;
    letter-spacing: -1px;
}

.subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 35px;
}

.toolbar {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

.filters {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
}

.filter {
    border: 1px solid var(--border);
    background: white;
    color: #6d7890;
    padding: 11px 17px;
    border-radius: 30px;
    cursor: pointer;
    font-weight: 700;
    font-size: 12px;
}

.filter.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
}

.controls {
    display: flex;
    gap: 10px;
}

input, select {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 15px;
    color: var(--text);
    font-size: 12px;
}

input {
    width: 215px;
}

.app-grid {
    display: grid;
    grid-template-columns: repeat(4,minmax(0,1fr));
    gap: 20px;
}

.app-card {
    background: white;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(50,65,110,.07);
    display: flex;
    flex-direction: column;
    transition: transform .25s,box-shadow .25s;
}

.app-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 18px 40px rgba(50,65,110,.15);
}

.artwork {
    height: 150px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg,#e4ebff,#f7e5f3);
}

.artwork-bg {
    position: absolute;
    inset: -30px;
    background-position: center;
    background-size: cover;
    filter: blur(30px);
    opacity: .65;
}

.app-icon {
    position: absolute;
    left: 22px;
    bottom: 16px;
    width: 83px;
    height: 83px;
    border-radius: 20px;
    border: 3px solid white;
    box-shadow: 0 6px 20px #24315440;
}

.card-body {
    padding: 21px;
    display: flex;
    flex-direction: column;
    flex: 1;
}

.category {
    align-self: flex-start;
    background: #eef1ff;
    color: #5b69bd;
    font-size: 10px;
    font-weight: 800;
    padding: 7px 10px;
    border-radius: 8px;
}

.app-title {
    font-size: 18px;
    font-weight: 800;
    margin: 15px 0 10px;
    line-height: 1.3;
}

.description {
    font-size: 12px;
    line-height: 1.65;
    color: var(--muted);
    margin: 0 0 20px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.card-bottom {
    margin-top: auto;
    border-top: 1px solid #eef0f6;
    padding-top: 16px;
}

.price-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 15px;
}

.price {
    font-size: 17px;
    font-weight: 850;
}

.iap {
    background: #f0e9ff;
    color: #7546c3;
    border-radius: 8px;
    padding: 6px 9px;
    font-size: 10px;
    font-weight: 800;
}

.store-button {
    display: block;
    text-align: center;
    background: #edf1ff;
    color: var(--primary-dark);
    padding: 13px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 800;
    transition: .2s;
}

.store-button:hover {
    background: var(--primary);
    color: white;
}

.status {
    grid-column: 1/-1;
    padding: 65px 20px;
    text-align: center;
    color: var(--muted);
}

.refresh-info {
    margin-top: 25px;
    font-size: 11px;
    color: #8994aa;
    text-align: center;
}

footer {
    border-top: 1px solid var(--border);
    background: rgba(255,255,255,.8);
    padding: 30px 20px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
}

footer a {
    color: var(--primary);
}

@media(max-width:1050px) {
    .app-grid {
        grid-template-columns: repeat(3,minmax(0,1fr));
    }
}

@media(max-width:760px) {
    .app-grid {
        grid-template-columns: repeat(2,minmax(0,1fr));
    }

    .controls {
        width: 100%;
    }

    input {
        flex: 1;
        min-width: 0;
    }
}

@media(max-width:480px) {
    main {
        padding: 30px 13px 60px;
    }

    .app-grid {
        gap: 11px;
    }

    .artwork {
        height: 110px;
    }

    .app-icon {
        width: 63px;
        height: 63px;
        left: 13px;
        bottom: 12px;
        border-radius: 15px;
    }

    .card-body {
        padding: 14px;
    }

    .app-title {
        font-size: 15px;
    }

    .description {
        font-size: 11px;
    }

    .controls {
        flex-wrap: wrap;
    }

    input,select {
        width: 100%;
    }
}
</style>
</head>

<body>

<header>
    <nav>
        <a href="#" class="logo">
            <span class="logo-icon">✦</span>
            Josh Swift Dev
        </a>

        <a class="contact"
           href="mailto:josh.swift.dev@gmail.com">
            Contact
        </a>
    </nav>
</header>

<main>

    <h1>Explore the Collection</h1>

    <p class="subtitle" id="appCount">
        Loading apps directly from Apple…
    </p>

    <div class="toolbar">

        <div class="filters" id="filters">
            <button class="filter active"
                    data-filter="all">
                All Apps
            </button>
        </div>

        <div class="controls">

            <input type="search"
                   id="search"
                   placeholder="Search apps…">

            <select id="sort">
                <option value="name">Alphabetical</option>
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option>
            </select>

        </div>

    </div>

    <div class="app-grid" id="appGrid">
        <div class="status">
            Retrieving your published apps…
        </div>
    </div>

    <div class="refresh-info" id="refreshInfo"></div>

</main>

<footer>
    © 2026 Josh Swift Dev ·
    <a href="mailto:josh.swift.dev@gmail.com">
        Contact
    </a>
</footer>


<script>
"use strict";

/*
=========================================
CONFIGURATION
=========================================
*/

const DEVELOPER_ID = "6809669072";
const COUNTRY = "us";

const DEVELOPER_API =
    `https://itunes.apple.com/lookup` +
    `?id=${DEVELOPER_ID}` +
    `&entity=software` +
    `&country=${COUNTRY}` +
    `&limit=200`;

/*
Every individual app receives its own
public lookup request.

A timestamp is added to discourage
browser caching.

Apple may still cache its own API
responses independently.
*/


/*
=========================================
STATE
=========================================
*/

let apps = [];
let activeFilter = "all";
let lastUpdated = null;

const grid = document.getElementById("appGrid");
const count = document.getElementById("appCount");
const filters = document.getElementById("filters");
const search = document.getElementById("search");
const sort = document.getElementById("sort");
const refreshInfo =
    document.getElementById("refreshInfo");


/*
=========================================
FETCH WITH TIMEOUT
=========================================
*/

async function fetchJSON(url) {

    const controller = new AbortController();

    const timeout = setTimeout(
        () => controller.abort(),
        12000
    );

    try {

        const response = await fetch(url, {
            cache: "no-store",
            signal: controller.signal
        });

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        return await response.json();

    } finally {
        clearTimeout(timeout);
    }
}


/*
=========================================
INDIVIDUAL APP LOOKUP
=========================================
*/

async function fetchIndividualApp(app) {

    const url =
        `https://itunes.apple.com/lookup` +
        `?id=${encodeURIComponent(app.trackId)}` +
        `&country=${COUNTRY}` +
        `&_=${Date.now()}`;

    try {

        const data = await fetchJSON(url);

        const listing = (data.results || [])
            .find(item =>
                item.wrapperType === "software" &&
                String(item.trackId) ===
                    String(app.trackId)
            );

        /*
        Only use the individual listing
        if Apple actually returned it.
        */

        if (listing) {

            return {
                ...app,
                ...listing,
                priceSource: "individual",
                priceVerified: true
            };
        }

    } catch (error) {

        console.warn(
            `Individual lookup failed for ${app.trackName}`,
            error
        );
    }

    /*
    Fallback to the original developer
    lookup if individual lookup fails.

    This is public Apple data, but it
    hasn't been independently checked
    against the individual listing.
    */

    return {
        ...app,
        priceSource: "developer",
        priceVerified: false
    };
}


/*
=========================================
LIMIT CONCURRENT REQUESTS
=========================================
*/

async function fetchIndividualListings(
    developerApps,
    concurrency = 4
) {

    const results = new Array(
        developerApps.length
    );

    let nextIndex = 0;

    async function worker() {

        while (nextIndex < developerApps.length) {

            const index = nextIndex++;

            results[index] =
                await fetchIndividualApp(
                    developerApps[index]
                );
        }
    }

    const workerCount = Math.min(
        concurrency,
        developerApps.length
    );

    await Promise.all(
        Array.from(
            { length: workerCount },
            () => worker()
        )
    );

    return results;
}


/*
=========================================
PRICE INFORMATION
=========================================
*/

function getPrice(app) {

    /*
    Apple's public listing provides
    formattedPrice and price.

    Never assume a missing price
    means Free.
    */

    if (
        typeof app.formattedPrice === "string" &&
        app.formattedPrice.trim()
    ) {
        return app.formattedPrice.trim();
    }

    if (
        typeof app.price === "number" &&
        Number.isFinite(app.price)
    ) {

        if (app.price === 0) {
            return "Free";
        }

        return new Intl.NumberFormat(
            "en-US",
            {
                style: "currency",
                currency: app.currency || "USD"
            }
        ).format(app.price);
    }

    return "Price unavailable";
}


function numericPrice(app) {

    if (
        typeof app.price === "number" &&
        Number.isFinite(app.price)
    ) {
        return app.price;
    }

    return null;
}


/*
=========================================
IAP DETECTION
=========================================

Apple's public lookup API does not
consistently expose the App Store
"In-App Purchases" label.

Never interpret the absence of that
information as proof that an app
doesn't have IAP.

This function only displays the label
if Apple explicitly supplies
recognizable IAP metadata.
*/

function getIAPStatus(app) {

    /*
    Some API variations may expose
    an explicit IAP property.

    Standard iTunes lookup responses
    generally do not provide it.
    */

    if (
        app.hasInAppPurchases === true ||
        app.hasIAP === true
    ) {
        return true;
    }

    if (
        app.hasInAppPurchases === false ||
        app.hasIAP === false
    ) {
        return false;
    }

    return null;
}


/*
=========================================
ARTWORK
=========================================
*/

function artworkURL(app) {

    return (
        app.artworkUrl512 ||
        app.artworkUrl100 ||
        app.artworkUrl60 ||
        ""
    );
}


/*
=========================================
FILTERS
=========================================
*/

function createFilters() {

    const genres = [
        ...new Set(
            apps
                .map(app => app.primaryGenreName)
                .filter(Boolean)
        )
    ].sort();

    filters.replaceChildren();

    const categories = [
        "all",
        ...genres
    ];

    categories.forEach(category => {

        const button =
            document.createElement("button");

        button.className =
            "filter" +
            (
                category === activeFilter
                    ? " active"
                    : ""
            );

        button.type = "button";

        button.textContent =
            category === "all"
                ? "All Apps"
                : category;

        button.addEventListener(
            "click",
            () => {

                activeFilter = category;

                document
                    .querySelectorAll(".filter")
                    .forEach(item =>
                        item.classList.remove(
                            "active"
                        )
                    );

                button.classList.add(
                    "active"
                );

                render();
            }
        );

        filters.appendChild(button);
    });
}


/*
=========================================
SORT
=========================================
*/

function sortApps(list) {

    const result = [...list];

    switch (sort.value) {

        case "newest":

            result.sort((a,b) =>
                new Date(b.releaseDate || 0) -
                new Date(a.releaseDate || 0)
            );

            break;

        case "oldest":

            result.sort((a,b) =>
                new Date(a.releaseDate || 0) -
                new Date(b.releaseDate || 0)
            );

            break;

        case "low":

            result.sort((a,b) => {

                const pa = numericPrice(a);
                const pb = numericPrice(b);

                if (pa === null) return 1;
                if (pb === null) return -1;

                return pa - pb;
            });

            break;

        case "high":

            result.sort((a,b) => {

                const pa = numericPrice(a);
                const pb = numericPrice(b);

                if (pa === null) return 1;
                if (pb === null) return -1;

                return pb - pa;
            });

            break;

        default:

            result.sort((a,b) =>
                (a.trackName || "")
                    .localeCompare(
                        b.trackName || ""
                    )
            );
    }

    return result;
}


/*
=========================================
SAFE DOM HELPERS
=========================================
*/

function element(
    tag,
    className,
    text
) {

    const node =
        document.createElement(tag);

    if (className) {
        node.className = className;
    }

    if (text !== undefined) {
        node.textContent = text;
    }

    return node;
}


/*
=========================================
CREATE APP CARD
=========================================
*/

function createCard(app) {

    const card =
        element("article","app-card");

    const art =
        element("div","artwork");

    const background =
        element("div","artwork-bg");

    const image =
        element("img","app-icon");

    const artwork =
        artworkURL(app);

    if (artwork) {
        background.style.backgroundImage =
            `url("${artwork}")`;
    }

    image.src = artwork;
    image.alt =
        `${app.trackName || "App"} icon`;
    image.loading = "lazy";

    art.append(
        background,
        image
    );


    const body =
        element("div","card-body");

    const category =
        element(
            "span",
            "category",
            app.primaryGenreName ||
                "iPhone App"
        );

    const title =
        element(
            "h3",
            "app-title",
            app.trackName || "App"
        );

    const description =
        element(
            "p",
            "description",
            (
                app.description ||
                "Explore this app on the App Store."
            ).replace(/\s+/g," ").trim()
        );

    const bottom =
        element("div","card-bottom");

    const priceRow =
        element("div","price-row");

    const price =
        element(
            "span",
            "price",
            getPrice(app)
        );

    priceRow.appendChild(price);


    /*
    Only display an IAP badge
    when Apple explicitly provides
    reliable positive metadata.
    */

    if (getIAPStatus(app) === true) {

        const badge =
            element(
                "span",
                "iap",
                "In-App Purchases"
            );

        priceRow.appendChild(badge);
    }


    const link =
        element(
            "a",
            "store-button",
            "View on App Store →"
        );

    link.href =
        app.trackViewUrl ||
        `https://apps.apple.com/us/app/id${app.trackId}`;

    link.target = "_blank";
    link.rel = "noopener noreferrer";

    bottom.append(
        priceRow,
        link
    );

    body.append(
        category,
        title,
        description,
        bottom
    );

    card.append(
        art,
        body
    );

    return card;
}


/*
=========================================
RENDER
=========================================
*/

function render() {

    const query =
        search.value.toLowerCase().trim();

    let visible = apps.filter(app => {

        const matchesCategory =
            activeFilter === "all" ||
            app.primaryGenreName ===
                activeFilter;

        const text = [
            app.trackName || "",
            app.primaryGenreName || "",
            app.description || ""
        ].join(" ").toLowerCase();

        return (
            matchesCategory &&
            (
                !query ||
                text.includes(query)
            )
        );
    });

    visible = sortApps(visible);

    grid.replaceChildren();

    if (!visible.length) {

        grid.appendChild(
            element(
                "div",
                "status",
                "No matching apps found."
            )
        );

        return;
    }

    const fragment =
        document.createDocumentFragment();

    visible.forEach(app =>
        fragment.appendChild(
            createCard(app)
        )
    );

    grid.appendChild(fragment);
}


/*
=========================================
LOAD ALL APPS
=========================================
*/

async function loadApps() {

    count.textContent =
        "Discovering your published apps…";

    try {

        /*
        Step 1:
        Discover the developer's
        publicly listed apps.
        */

        const developerData =
            await fetchJSON(
                DEVELOPER_API +
                `&_=${Date.now()}`
            );

        const developerApps =
            (developerData.results || [])
                .filter(item =>
                    item.wrapperType ===
                        "software" &&
                    item.trackId
                );

        if (!developerApps.length) {

            throw new Error(
                "No apps returned by Apple's developer lookup."
            );
        }

        /*
        Step 2:
        Fetch each app's individual
        public listing independently.
        */

        count.textContent =
            `Checking ${developerApps.length} individual App Store listings…`;

        apps =
            await fetchIndividualListings(
                developerApps,
                4
            );

        /*
        Step 3:
        Display the results.
        */

        createFilters();
        render();

        lastUpdated = new Date();

        count.textContent =
            `${apps.length} published apps`;

        const verifiedCount =
            apps.filter(
                app => app.priceVerified
            ).length;

        refreshInfo.textContent =
            `Checked ${verifiedCount} of ${apps.length} individual Apple listings · ` +
            `Updated ${lastUpdated.toLocaleTimeString()}`;

        if (
            verifiedCount <
            apps.length
        ) {

            refreshInfo.textContent +=
                " · Some prices use Apple's developer listing as a fallback";
        }

    } catch(error) {

        console.error(error);

        count.textContent =
            "Unable to retrieve apps";

        grid.replaceChildren();

        grid.appendChild(
            element(
                "div",
                "status",
                "Apple's public app data is temporarily unavailable. Please refresh the page."
            )
        );
    }
}


/*
=========================================
EVENTS
=========================================
*/

search.addEventListener(
    "input",
    render
);

sort.addEventListener(
    "change",
    render
);


/*
=========================================
INITIAL LOAD
=========================================
*/

loadApps();

</script>

</body>
</html>
